# Redraws the contribution-graph snake once a day and publishes the SVGs to
# the `output` branch, which README.md loads from raw.githubusercontent.com.
#
# Security notes
# - Third-party action is pinned to a full commit SHA (Platane/snk v3.5.0),
#   so a moved or hijacked tag can't change what runs here.
# - The token gets only `contents: write`, and only for this one job.
# - No checkout step: nothing from the repo is executed, and the token is
#   never written to .git/config. It is passed to git as a one-off header.
# - Runs on schedule / manual trigger only, never on pull requests.

name: snake

on:
  schedule:
    - cron: "17 0 * * *" # 05:47 IST daily; off the top of the hour to avoid queue spikes
  workflow_dispatch:

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ffd23f&color_dots=#1a1430,#2c2150,#4b3a99,#8b4fd6,#ff4fd8
            dist/snake-light.svg?color_snake=#c4198d&color_dots=#f1edff,#e0d7fe,#c3b3fb,#9f7cf0,#e05cc0

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          test -s snake-dark.svg && test -s snake-light.svg
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-dark.svg snake-light.svg
          git commit -q -m "Update contribution snake"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push -q --force "https://github.com/${REPO}.git" output
