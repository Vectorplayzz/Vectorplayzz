<title id="t">About</title>
<desc id="d">Agents that ask first: Evidence before conclusions, and a human approval before anything that can't be undone. Ship the whole thing: Not just the model: the API, the interface, auth and the tests around it. Run what I build: Every live demo runs on servers I set up, harden and keep alive myself.</desc>
