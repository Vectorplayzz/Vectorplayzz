<title id="t">ClutchR</title>
<desc id="d">ClutchR: Esports tournament platform with teams, matches, leaderboards and a wallet, behind JWT auth, role-based access and rate limits. 11 data models · 3 roles. Built with TypeScript, Express, Prisma.</desc>
