<title id="t">OpsLoop</title>
<desc id="d">OpsLoop: SRE agent that doesn't stop at “fix applied”. It checks that health actually held, and rolls back on its own when it didn't. 98 tests · injection-hardened logs. Built with Python, Discord, Loki.</desc>
